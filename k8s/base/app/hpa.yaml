apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: live-app-backend
  labels:
    app.kubernetes.io/name: live-app-backend
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: live-app-backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
