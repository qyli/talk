apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: live-app-ingress
  labels:
    app.kubernetes.io/name: live-app-backend
    app.kubernetes.io/component: ingress
spec:
  ingressClassName: nginx
  rules:
    - host: placeholder.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: live-app-backend
                port:
                  number: 80
